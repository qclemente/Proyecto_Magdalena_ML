# Configuracion de MyST (Jupyter Book 2)
version: 1
project:
  id: proyecto-magdalena-ml
  title: "Proyecto de investigacion: descarga efectiva en el rio Magdalena"
  short_title: "Descarga efectiva - Magdalena"
  description: >-
    Clasificacion de los dias de descarga efectiva en el rio Magdalena
    a partir del registro hidrologico del IDEAM.
  authors:
    - name: Kevin Clemente Rosario
    - name: Manuel Meza
  keywords:
    - hidrologia
    - transporte de sedimentos
    - descarga efectiva
    - rio Magdalena
    - machine learning
  github: https://github.com/qclemente/Proyecto_Magdalena_ML
  toc:
    - file: proyecto.ipynb
    - file: DESCARGA_DATOS.md
  numbering:
    headings: false
  exclude:
    - _build/**
    - intro.md
    - datos/crudos/**
    - README.md
site:
  template: book-theme
  options:
    favicon: ""
    logo_text: "Descarga efectiva - Rio Magdalena"
